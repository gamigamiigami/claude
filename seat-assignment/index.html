<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>席替えツール</title>
<style>
/* ── Variables ── */
:root {
  --primary: #4a6fa5;
  --primary-dark: #3a5a8a;
  --danger: #e74c3c;
  --warn: #f39c12;
  --success: #27ae60;
  --bg: #f5f7fa;
  --surface: #ffffff;
  --border: #dce1e7;
  --text: #2c3e50;
  --text-muted: #7f8c8d;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --radius: 8px;
}

/* ── Reset ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }
button { cursor: pointer; font-family: inherit; font-size: 14px; border: none; border-radius: var(--radius); padding: 8px 14px; transition: background 0.15s, opacity 0.15s; }
button:disabled { opacity: 0.5; cursor: not-allowed; }
input, select, textarea { font-family: inherit; font-size: 14px; border: 1px solid var(--border); border-radius: var(--radius); padding: 7px 10px; width: 100%; outline: none; }
input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(74,111,165,0.15); }
label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 4px; }

/* ── Layout ── */
#app { display: flex; flex-direction: column; min-height: 100vh; }

.header { background: var(--primary); color: #fff; padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.header h1 { font-size: 18px; font-weight: 700; white-space: nowrap; }
.header-classroom { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
.header-classroom select { max-width: 200px; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.15); color: #fff; }
.header-classroom select option { color: var(--text); background: #fff; }
.btn-ghost { background: rgba(255,255,255,0.2); color: #fff; border: 1px solid rgba(255,255,255,0.4); padding: 6px 12px; font-size: 13px; }
.btn-ghost:hover { background: rgba(255,255,255,0.3); }

.tabs { background: var(--surface); border-bottom: 2px solid var(--border); display: flex; overflow-x: auto; }
.tab-btn { background: none; border-radius: 0; padding: 12px 18px; color: var(--text-muted); border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap; font-size: 14px; }
.tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
.tab-btn:hover:not(.active) { background: var(--bg); color: var(--text); }

.tab-content { display: none; padding: 20px; flex: 1; }
.tab-content.active { display: block; }

/* ── Buttons ── */
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { background: #c0392b; }
.btn-success { background: var(--success); color: #fff; }
.btn-success:hover:not(:disabled) { background: #219a52; }
.btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover:not(:disabled) { background: var(--bg); }
.btn-warn { background: var(--warn); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* ── Cards / sections ── */
.card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
.card-title { font-size: 15px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field input[type="number"] { width: 80px; }

/* ── Student list ── */
.student-list { display: flex; flex-direction: column; gap: 6px; max-height: 400px; overflow-y: auto; }
.student-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }
.student-item:hover { border-color: var(--primary); }
.student-name { flex: 1; font-weight: 500; }
.student-badge { font-size: 11px; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.badge-group { background: var(--group-color, #eee); color: #fff; }
.badge-fixed { background: #3498db; color: #fff; }

/* ── Seat Grid ── */
.grid-wrapper { overflow-x: auto; }
.blackboard-label { text-align: center; font-size: 12px; color: var(--text-muted); background: #2ecc71; color: #fff; border-radius: 4px; padding: 4px 12px; display: inline-block; margin-bottom: 6px; }
.seat-grid { display: inline-grid; gap: 6px; }
.seat-cell {
  width: 82px; height: 62px;
  border: 2px solid var(--border);
  border-radius: 6px;
  background: var(--surface);
  cursor: pointer;
  position: relative;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  transition: border-color 0.15s, transform 0.1s;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
}
.seat-cell:hover { border-color: var(--primary); transform: scale(1.03); z-index: 1; }
.seat-cell.empty-slot { background: #f0f0f0; cursor: default; border-style: dashed; }
.seat-cell.empty-slot:hover { transform: none; border-color: var(--border); }
.seat-cell.disabled { background: #e8e8e8; cursor: not-allowed; opacity: 0.5; }
.seat-cell.selected { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
.seat-cell.warn-seat { border-color: var(--warn); background: #fffbf0; }
.seat-cell.error-seat { border-color: var(--danger); background: #fff5f5; }
.seat-cell.fixed-seat { border-style: double; border-width: 3px; }
.seat-cell.ng-target { border-color: var(--danger); background: #ffe8e8; }
.cell-name { font-size: 12px; font-weight: 600; text-align: center; line-height: 1.2; }
.cell-group { font-size: 10px; color: var(--text-muted); }
.cell-orient { position: absolute; top: 2px; right: 4px; font-size: 10px; opacity: 0.6; }
.cell-lock { position: absolute; bottom: 2px; right: 4px; font-size: 11px; }
.cell-warn-badge { position: absolute; top: 2px; left: 4px; font-size: 10px; }
.cell-empty-label { font-size: 11px; color: #ccc; }

/* Side orientation visual */
.seat-cell.orient-side { transform-origin: center; }
.orient-arrow { display: none; }

/* ── Warn panel ── */
.warn-panel { margin-top: 16px; }
.warn-item { display: flex; align-items: flex-start; gap: 8px; padding: 8px 12px; border-radius: 6px; margin-bottom: 6px; font-size: 13px; cursor: pointer; }
.warn-item:hover { opacity: 0.85; }
.warn-item.warn { background: #fff9e6; border: 1px solid #f9d94e; }
.warn-item.error { background: #fff0f0; border: 1px solid var(--danger); }
.warn-item.info { background: #f0f7ff; border: 1px solid #90c2f5; }
.warn-icon { font-size: 16px; flex-shrink: 0; margin-top: 1px; }

/* ── Groups ── */
.group-card { border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; border: 2px solid transparent; }
.group-card:hover { opacity: 0.9; }
.group-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.group-name-input { font-size: 14px; font-weight: 600; border: none; background: transparent; flex: 1; border-bottom: 1px dashed #aaa; outline: none; }
.color-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(0,0,0,0.2); cursor: pointer; flex-shrink: 0; }
.group-members { display: flex; flex-wrap: wrap; gap: 4px; }
.member-chip { font-size: 12px; padding: 3px 9px; border-radius: 99px; background: rgba(0,0,0,0.12); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.member-chip:hover { background: rgba(0,0,0,0.22); }

/* ── Roster ── */
.roster-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.roster-card { border-radius: 8px; padding: 12px; }
.roster-card h3 { font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.roster-card ol { padding-left: 18px; font-size: 13px; line-height: 1.8; }

/* ── History ── */
.history-list { display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto; }
.history-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--bg); border-radius: 6px; border: 1px solid var(--border); }
.history-item:hover { border-color: var(--primary); }
.history-label { flex: 1; font-weight: 500; }
.history-date { font-size: 12px; color: var(--text-muted); white-space: nowrap; }

/* ── NG rules ── */
.ng-list { display: flex; flex-direction: column; gap: 6px; max-height: 250px; overflow-y: auto; }
.ng-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #fff0f0; border: 1px solid #f5c0c0; border-radius: 6px; font-size: 13px; }
.ng-item .ng-text { flex: 1; }

/* ── Modal ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
.modal-overlay.open { display: flex; }
.modal { background: var(--surface); border-radius: 12px; padding: 24px; width: 100%; max-width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal h2 { font-size: 17px; margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* ── Misc utils ── */
.flex { display: flex; }
.gap-8 { gap: 8px; }
.gap-12 { gap: 12px; }
.flex-wrap { flex-wrap: wrap; }
.items-center { align-items: center; }
.mt-12 { margin-top: 12px; }
.mt-16 { margin-top: 16px; }
.mb-8 { margin-bottom: 8px; }
.text-muted { color: var(--text-muted); font-size: 13px; }
.text-sm { font-size: 12px; }
.font-bold { font-weight: 700; }
.w-full { width: 100%; }
.divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
.count-badge { background: var(--danger); color: #fff; border-radius: 99px; font-size: 11px; padding: 1px 6px; }
.empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; }

/* ── Print ── */
@media print {
  .header, .tabs, .tab-content:not(#tab-roster), .no-print { display: none !important; }
  #tab-roster { display: block !important; }
  .card { box-shadow: none; border: 1px solid #ccc; }
  .seat-cell { border: 1px solid #000 !important; box-shadow: none !important; }
}

@media (max-width: 600px) {
  .tab-btn { padding: 10px 12px; font-size: 13px; }
  .seat-cell { width: 68px; height: 52px; }
  .cell-name { font-size: 11px; }
}
</style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <div class="header">
    <h1>📋 席替えツール</h1>
    <div class="header-classroom">
      <select id="classroomSelect" onchange="selectClassroom(this.value)"></select>
      <button class="btn-ghost btn-sm" onclick="openModal('addClassroom')">＋ 新規</button>
      <button class="btn-ghost btn-sm" onclick="openModal('renameClassroom')">編集</button>
      <button class="btn-ghost btn-sm" onclick="exportData()">💾 保存</button>
      <button class="btn-ghost btn-sm" onclick="triggerImport()">📂 読込</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('layout')" id="tab-btn-layout">🏫 教室設定</button>
    <button class="tab-btn" onclick="switchTab('students')" id="tab-btn-students">👥 生徒</button>
    <button class="tab-btn" onclick="switchTab('groups')" id="tab-btn-groups">🎨 グループ</button>
    <button class="tab-btn" onclick="switchTab('ng')" id="tab-btn-ng">🚫 NG設定</button>
    <button class="tab-btn" onclick="switchTab('seating')" id="tab-btn-seating">🎲 席替え</button>
    <button class="tab-btn" onclick="switchTab('roster')" id="tab-btn-roster">📃 名簿</button>
    <button class="tab-btn" onclick="switchTab('history')" id="tab-btn-history">🕐 履歴</button>
  </div>

  <!-- Tab: 教室設定 -->
  <div class="tab-content active" id="tab-layout">
    <div class="card">
      <div class="card-title">教室レイアウト</div>
      <div class="section-row">
        <div class="field">
          <label>列数（横）</label>
          <input type="number" id="colsInput" min="1" max="12" value="6" style="width:80px">
        </div>
        <div class="field">
          <label>行数（縦）</label>
          <input type="number" id="rowsInput" min="1" max="10" value="5" style="width:80px">
        </div>
        <button class="btn-primary" onclick="applyLayout()">レイアウト適用</button>
      </div>
      <p class="text-muted mb-8">机をクリックして向き・空席・固定設定を変更できます。</p>
    </div>
    <div class="card">
      <div class="card-title">
        <span>📐 座席マップ</span>
        <span class="text-muted text-sm">（黒板が前）</span>
      </div>
      <div style="text-align:center; margin-bottom:8px"><span class="blackboard-label">黒板（前）</span></div>
      <div class="grid-wrapper">
        <div class="seat-grid" id="layoutGrid"></div>
      </div>
      <div id="cellEditPanel" style="display:none; margin-top:16px; padding:12px; background:var(--bg); border-radius:8px; border:1px solid var(--border);">
        <div class="font-bold mb-8" id="cellEditTitle">机の設定</div>
        <div class="section-row">
          <div class="field">
            <label>向き</label>
            <select id="cellOrientSelect" onchange="setCellOrient(this.value)">
              <option value="front">前向き ↑</option>
              <option value="side-left">横向き（左）←</option>
              <option value="side-right">横向き（右）→</option>
            </select>
          </div>
          <div class="field">
            <label>　</label>
            <button class="btn-secondary" onclick="toggleCellDisabled()" id="disableBtn">この席を無効化</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab: 生徒 -->
  <div class="tab-content" id="tab-students">
    <div class="card">
      <div class="card-title">生徒名簿</div>
      <div class="section-row">
        <input type="text" id="newStudentName" placeholder="生徒名を入力" style="max-width:200px" onkeydown="if(event.key==='Enter')addStudent()">
        <button class="btn-primary" onclick="addStudent()">＋ 追加</button>
        <button class="btn-secondary" onclick="openModal('csvImport')">CSVインポート</button>
        <button class="btn-secondary" onclick="exportStudentCSV()">CSVエクスポート</button>
      </div>
      <div id="studentList" class="student-list"></div>
      <div class="text-muted mt-12" id="studentCount"></div>
    </div>
  </div>

  <!-- Tab: グループ -->
  <div class="tab-content" id="tab-groups">
    <div class="card">
      <div class="card-title">グループ（班）管理</div>
      <div class="section-row">
        <button class="btn-primary" onclick="addGroup()">＋ グループ追加</button>
        <button class="btn-secondary" onclick="autoDistributeGroups()">均等に自動振り分け</button>
      </div>
      <div id="groupList"></div>
    </div>
    <div class="card">
      <div class="card-title">グループ未所属の生徒</div>
      <div id="ungroupedStudents" class="flex flex-wrap gap-8"></div>
    </div>
  </div>

  <!-- Tab: NG設定 -->
  <div class="tab-content" id="tab-ng">
    <div class="card">
      <div class="card-title">🚫 隣席NG（隣にできないペア）</div>
      <div class="section-row">
        <select id="ngPairA" style="max-width:150px"></select>
        <span style="padding-top:8px">×</span>
        <select id="ngPairB" style="max-width:150px"></select>
        <input type="text" id="ngPairReason" placeholder="理由（任意）" style="max-width:160px">
        <button class="btn-danger" onclick="addNGPair()">追加</button>
      </div>
      <div id="ngPairList" class="ng-list"></div>
    </div>
    <div class="card">
      <div class="card-title">🚫 着席NG（座れない席）</div>
      <div class="section-row">
        <select id="ngSeatStudent" style="max-width:160px" onchange="updateNGSeatMode()"></select>
        <span class="text-muted">を選択して、グリッドの席をクリックしてNG席を設定</span>
      </div>
      <div id="ngSeatInfo" class="text-muted mb-8"></div>
      <div class="grid-wrapper">
        <div style="text-align:center; margin-bottom:8px"><span class="blackboard-label">黒板（前）</span></div>
        <div class="seat-grid" id="ngSeatGrid"></div>
      </div>
    </div>
  </div>

  <!-- Tab: 席替え -->
  <div class="tab-content" id="tab-seating">
    <div class="card">
      <div class="section-row items-center">
        <button class="btn-success" style="font-size:16px; padding:10px 24px;" onclick="runSeating()">🎲 席替え実行</button>
        <button class="btn-secondary" onclick="saveCurrentAsHistory()" id="saveHistoryBtn" disabled>💾 履歴に保存</button>
        <button class="btn-secondary no-print" onclick="window.print()">🖨 印刷</button>
      </div>
      <div id="seatingWarnings" class="warn-panel"></div>
    </div>
    <div class="card">
      <div class="card-title">座席表</div>
      <div style="text-align:center; margin-bottom:8px"><span class="blackboard-label">黒板（前）</span></div>
      <div class="grid-wrapper">
        <div class="seat-grid" id="seatingGrid"></div>
      </div>
    </div>
  </div>

  <!-- Tab: 名簿 -->
  <div class="tab-content" id="tab-roster">
    <div class="no-print card">
      <div class="section-row">
        <button class="btn-secondary" onclick="window.print()">🖨 印刷</button>
      </div>
    </div>
    <div class="card">
      <div class="card-title">班別名簿</div>
      <div id="rosterContent"></div>
    </div>
    <div class="card" id="seatMapPrintCard">
      <div class="card-title">座席表</div>
      <div style="text-align:center; margin-bottom:8px"><span class="blackboard-label">黒板（前）</span></div>
      <div class="grid-wrapper">
        <div class="seat-grid" id="rosterGrid"></div>
      </div>
    </div>
  </div>

  <!-- Tab: 履歴 -->
  <div class="tab-content" id="tab-history">
    <div class="card">
      <div class="card-title">席替え履歴</div>
      <div id="historyList" class="history-list"></div>
    </div>
    <div class="card" id="historyPreviewCard" style="display:none">
      <div class="card-title" id="historyPreviewTitle">履歴プレビュー</div>
      <div style="text-align:center; margin-bottom:8px"><span class="blackboard-label">黒板（前）</span></div>
      <div class="grid-wrapper">
        <div class="seat-grid" id="historyPreviewGrid"></div>
      </div>
    </div>
  </div>

  <!-- Modals -->
  <div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
    <div class="modal">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
const STORAGE_KEY = 'seat_tool_v1';
const GROUP_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#e91e63','#795548','#607d8b'];

let state = {
  classrooms: [],
  activeId: null,
};

let currentDraft = null; // { seats: { "r-c": studentId|null }, warnings: [] }
let selectedLayoutCell = null;
let ngSeatMode = false;

// ─────────────────────────────────────────────
// PERSISTENCE
// ─────────────────────────────────────────────
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      state = JSON.parse(raw);
    }
  } catch(e) {}
  if (!state.classrooms) state.classrooms = [];
  if (!state.activeId && state.classrooms.length > 0) state.activeId = state.classrooms[0].id;
  if (state.classrooms.length === 0) {
    createClassroom('サンプル教室', 5, 6);
  }
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

// ─────────────────────────────────────────────
// CLASSROOM HELPERS
// ─────────────────────────────────────────────
function uid() {
  return Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
}

function getClassroom() {
  return state.classrooms.find(c => c.id === state.activeId) || null;
}

function createClassroom(name, rows, cols) {
  const c = {
    id: uid(),
    name,
    rows: rows || 5,
    cols: cols || 6,
    students: [],
    groups: [],
    history: [],
    ngPairs: [],
    deskMeta: {},  // "r-c" -> { orient:"front"|"side-left"|"side-right", disabled:bool, fixedStudentId:null, ngStudentIds:[] }
  };
  state.classrooms.push(c);
  state.activeId = c.id;
  saveState();
  return c;
}

function getDeskMeta(cr, r, c) {
  const key = `${r}-${c}`;
  if (!cr.deskMeta[key]) cr.deskMeta[key] = { orient:'front', disabled:false, fixedStudentId:null, ngStudentIds:[] };
  return cr.deskMeta[key];
}

function getSeatKey(r, c) { return `${r}-${c}`; }
function parseSeatKey(k) { const [r,c] = k.split('-'); return { r:+r, c:+c }; }

function getEnabledSeats(cr) {
  const seats = [];
  for (let r = 0; r < cr.rows; r++) for (let c = 0; c < cr.cols; c++) {
    if (!getDeskMeta(cr, r, c).disabled) seats.push(getSeatKey(r, c));
  }
  return seats;
}

function getNeighbors(cr, key) {
  const { r, c } = parseSeatKey(key);
  const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
  return dirs.map(([dr,dc]) => {
    const nr = r+dr, nc = c+dc;
    if (nr<0||nr>=cr.rows||nc<0||nc>=cr.cols) return null;
    const m = getDeskMeta(cr, nr, nc);
    if (m.disabled) return null;
    return getSeatKey(nr, nc);
  }).filter(Boolean);
}

function getStudentById(cr, id) { return cr.students.find(s => s.id === id) || null; }
function getStudentName(cr, id) { const s = getStudentById(cr, id); return s ? s.name : '（削除済み）'; }
function getGroupById(cr, id) { return cr.groups.find(g => g.id === id) || null; }
function getGroupForStudent(cr, sid) { return cr.groups.find(g => g.memberIds && g.memberIds.includes(sid)) || null; }

// ─────────────────────────────────────────────
// RANDOMIZATION ALGORITHM
// ─────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function runSeatingAlgorithm(cr) {
  const enabledSeats = getEnabledSeats(cr);
  const activeStudents = cr.students.filter(s => !s.inactive);

  // Separate fixed and floating
  const fixedEntries = []; // { seatKey, studentId }
  const fixedStudentIds = new Set();
  for (const key of enabledSeats) {
    const m = getDeskMeta(cr, ...key.split('-').map(Number));
    if (m.fixedStudentId) {
      const s = getStudentById(cr, m.fixedStudentId);
      if (s && !s.inactive) {
        fixedEntries.push({ seatKey: key, studentId: m.fixedStudentId });
        fixedStudentIds.add(m.fixedStudentId);
      }
    }
  }

  const floatingStudents = activeStudents.filter(s => !fixedStudentIds.has(s.id));
  const floatingSeats = enabledSeats.filter(key => !fixedEntries.find(f => f.seatKey === key));

  if (floatingStudents.length > floatingSeats.length) {
    return { success: false, message: `生徒数（${floatingStudents.length}名）が利用可能な席数（${floatingSeats.length}席）を超えています。空席か無効化した机を増やすか、生徒を非表示にしてください。` };
  }

  // Build initial assignment with fixed seats
  const assignment = {};
  for (const f of fixedEntries) assignment[f.seatKey] = f.studentId;

  // Try to place remaining students (max 300 restarts)
  const MAX_RESTART = 300;
  let success = false;

  outer: for (let attempt = 0; attempt < MAX_RESTART; attempt++) {
    const tryAssign = { ...assignment };
    const shuffledStudents = shuffle(floatingStudents);
    const shuffledSeats = shuffle(floatingSeats);

    let failed = false;
    for (const student of shuffledStudents) {
      let placed = false;
      for (const seatKey of shuffledSeats) {
        if (tryAssign[seatKey] !== undefined) continue;
        if (hardConstraintOk(cr, student, seatKey, tryAssign)) {
          tryAssign[seatKey] = student.id;
          placed = true;
          break;
        }
      }
      if (!placed) { failed = true; break; }
    }

    if (!failed) {
      Object.assign(assignment, tryAssign);
      // Fill unfixed, unassigned enabled seats with null
      for (const key of enabledSeats) {
        if (assignment[key] === undefined) assignment[key] = null;
      }
      success = true;
      break;
    }
  }

  if (!success) {
    // Relax NG pairs, just do random
    const tryAssign = { ...assignment };
    const shuffledStudents = shuffle(floatingStudents);
    const shuffledSeats = shuffle([...floatingSeats]);
    let si = 0;
    for (const student of shuffledStudents) {
      // Try to find at least an NG-seat-free slot
      let placed = false;
      for (let i = 0; i < shuffledSeats.length; i++) {
        const key = shuffledSeats[i];
        if (tryAssign[key] !== undefined) continue;
        const m = getDeskMeta(cr, ...key.split('-').map(Number));
        if (!m.ngStudentIds.includes(student.id)) {
          tryAssign[key] = student.id;
          placed = true;
          break;
        }
      }
      if (!placed) {
        for (const key of shuffledSeats) {
          if (tryAssign[key] === undefined) { tryAssign[key] = student.id; placed = true; break; }
        }
      }
    }
    Object.assign(assignment, tryAssign);
    for (const key of enabledSeats) if (assignment[key] === undefined) assignment[key] = null;
  }

  const warnings = checkSoftConstraints(cr, assignment);
  if (!success) {
    warnings.unshift({ type: 'error', severity: 'error', message: 'NG条件を完全に満たす配置が見つかりませんでした。NG設定を確認してください。配置は一部条件を無視しています。' });
  }

  return { success: true, assignment, warnings };
}

function hardConstraintOk(cr, student, seatKey, currentAssignment) {
  const m = getDeskMeta(cr, ...seatKey.split('-').map(Number));
  // NG seat
  if (m.ngStudentIds && m.ngStudentIds.includes(student.id)) return false;
  // NG pair: check neighbors already assigned
  const neighbors = getNeighbors(cr, seatKey);
  for (const nKey of neighbors) {
    const nStudent = currentAssignment[nKey];
    if (!nStudent) continue;
    if (isNGPair(cr, student.id, nStudent)) return false;
  }
  return true;
}

function isNGPair(cr, idA, idB) {
  return cr.ngPairs && cr.ngPairs.some(p =>
    (p.a === idA && p.b === idB) || (p.a === idB && p.b === idA)
  );
}

function checkSoftConstraints(cr, assignment) {
  const warnings = [];

  if (!cr.history || cr.history.length === 0) return warnings;

  // Reverse assignment: studentId -> seatKey
  const studentSeat = {};
  for (const [key, sid] of Object.entries(assignment)) {
    if (sid) studentSeat[sid] = key;
  }

  // Build current adjacency
  const currentAdj = {};
  for (const [key, sid] of Object.entries(assignment)) {
    if (!sid) continue;
    currentAdj[sid] = new Set();
    for (const nKey of getNeighbors(cr, key)) {
      if (assignment[nKey]) currentAdj[sid].add(assignment[nKey]);
    }
  }

  // Current group membership
  const currentGroup = {};
  for (const g of (cr.groups || [])) {
    for (const sid of (g.memberIds || [])) currentGroup[sid] = g.id;
  }

  const lastHistory = cr.history[cr.history.length - 1];

  for (const sid of Object.keys(studentSeat)) {
    const name = getStudentName(cr, sid);

    // 1. Same seat as last time
    if (lastHistory && lastHistory.seats[studentSeat[sid]] === sid) {
      warnings.push({ type:'same_seat', severity:'warn', message:`${name} は前回と同じ席です`, studentId:sid, seats:[studentSeat[sid]] });
    }

    // 2. Adjacent history check (all history)
    for (const h of cr.history) {
      const prevAdj = new Set();
      for (const [hKey, hSid] of Object.entries(h.seats)) {
        if (hSid !== sid) continue;
        for (const nKey of getNeighbors(cr, hKey)) {
          if (h.seats[nKey]) prevAdj.add(h.seats[nKey]);
        }
      }
      for (const adjId of (currentAdj[sid] || [])) {
        if (prevAdj.has(adjId)) {
          const adjName = getStudentName(cr, adjId);
          warnings.push({ type:'adj_history', severity:'info', message:`${name} と ${adjName} は「${h.label}」でも隣でした`, seats:[studentSeat[sid], studentSeat[adjId]] });
        }
      }
    }

    // 3. Same group as before in same group check (previous group member history)
    if (currentGroup[sid]) {
      const curGroupMembers = (cr.groups.find(g => g.id === currentGroup[sid])?.memberIds || []).filter(x => x !== sid);
      for (const h of cr.history) {
        if (!h.groupSnapshot) continue;
        const prevGroupId = h.groupSnapshot[sid];
        if (!prevGroupId) continue;
        const prevGroupMembers = new Set(Object.entries(h.groupSnapshot).filter(([k,v]) => v === prevGroupId && k !== sid).map(([k]) => k));
        for (const memberId of curGroupMembers) {
          if (prevGroupMembers.has(memberId)) {
            const memberName = getStudentName(cr, memberId);
            warnings.push({ type:'group_history', severity:'info', message:`${name} と ${memberName} は「${h.label}」でも同じ班でした`, seats:[studentSeat[sid], studentSeat[memberId]] });
          }
        }
      }
    }
  }

  // Deduplicate
  const seen = new Set();
  return warnings.filter(w => {
    const key = w.message;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

// ─────────────────────────────────────────────
// UI RENDERING
// ─────────────────────────────────────────────
function renderAll() {
  renderHeader();
  renderLayoutGrid();
  renderStudentList();
  renderGroupList();
  renderNGPanel();
  renderSeatingGrid();
  renderHistoryList();
  renderRoster();
  document.getElementById('saveHistoryBtn').disabled = !currentDraft;
}

function renderHeader() {
  const sel = document.getElementById('classroomSelect');
  const prev = sel.value;
  sel.innerHTML = state.classrooms.map(c => `<option value="${c.id}" ${c.id===state.activeId?'selected':''}>${escHtml(c.name)}</option>`).join('');
}

function renderGrid(containerId, cr, mode, extraData) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!cr) { el.innerHTML = ''; return; }
  el.style.gridTemplateColumns = `repeat(${cr.cols}, auto)`;
  el.innerHTML = '';
  for (let r = 0; r < cr.rows; r++) {
    for (let c = 0; c < cr.cols; c++) {
      el.appendChild(buildCell(cr, r, c, mode, extraData));
    }
  }
}

function buildCell(cr, r, c, mode, extraData) {
  const meta = getDeskMeta(cr, r, c);
  const key = getSeatKey(r, c);
  const div = document.createElement('div');
  div.className = 'seat-cell';
  div.dataset.row = r;
  div.dataset.col = c;
  div.dataset.key = key;

  if (meta.disabled) {
    div.classList.add('disabled');
    div.innerHTML = '<span class="cell-empty-label">×</span>';
    return div;
  }

  // Group color background
  let studentId = null;
  let assignment = null;
  if (mode === 'seating' && currentDraft) assignment = currentDraft.assignment;
  else if (mode === 'history' && extraData) assignment = extraData;
  else if (mode === 'roster' && currentDraft) assignment = currentDraft.assignment;

  if (assignment) studentId = assignment[key] || null;

  const group = studentId ? getGroupForStudent(cr, studentId) : null;
  if (group) {
    div.style.backgroundColor = group.color + '33';
    div.style.borderColor = group.color;
  }

  // Warnings
  let warnSeverity = null;
  if (mode === 'seating' && currentDraft?.warnings) {
    for (const w of currentDraft.warnings) {
      if (w.seats && w.seats.includes(key)) {
        if (w.severity === 'error') { warnSeverity = 'error'; break; }
        if (w.severity === 'warn') warnSeverity = 'warn';
        else if (!warnSeverity) warnSeverity = 'info';
      }
    }
  }
  if (warnSeverity === 'error') div.classList.add('error-seat');
  else if (warnSeverity === 'warn') div.classList.add('warn-seat');

  // Fixed
  if (meta.fixedStudentId) div.classList.add('fixed-seat');

  // Selected in layout mode
  if (mode === 'layout' && selectedLayoutCell && selectedLayoutCell.r===r && selectedLayoutCell.c===c) div.classList.add('selected');

  // NG seat highlight mode
  if (mode === 'ng') {
    const ngSid = document.getElementById('ngSeatStudent')?.value;
    if (ngSid && meta.ngStudentIds && meta.ngStudentIds.includes(ngSid)) div.classList.add('ng-target');
  }

  // Orient indicator
  const orientMap = { 'front':'↑', 'side-left':'←', 'side-right':'→' };
  const orientLabel = orientMap[meta.orient] || '↑';

  // Name label
  const name = studentId ? getStudentName(cr, studentId) : '';
  const groupLabel = group ? `${group.name}` : '';

  div.innerHTML = `
    <span class="cell-orient">${orientLabel}</span>
    ${warnSeverity ? `<span class="cell-warn-badge">${warnSeverity==='error'?'❌':warnSeverity==='warn'?'⚠️':'ℹ️'}</span>` : ''}
    <span class="cell-name">${escHtml(name) || (mode==='layout'?`<span style="color:#ccc;font-size:11px">${r+1}-${c+1}</span>`:'')}</span>
    <span class="cell-group">${escHtml(groupLabel)}</span>
    ${meta.fixedStudentId ? '<span class="cell-lock">🔒</span>' : ''}
  `;

  // Click handlers
  if (mode === 'layout') {
    div.onclick = () => selectLayoutCell(r, c);
  } else if (mode === 'ng') {
    div.onclick = () => toggleNGSeat(r, c);
  }

  return div;
}

function renderLayoutGrid() {
  const cr = getClassroom();
  renderGrid('layoutGrid', cr, 'layout');
  renderCellEditPanel();
}

function renderCellEditPanel() {
  const panel = document.getElementById('cellEditPanel');
  if (!selectedLayoutCell) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  const cr = getClassroom();
  const { r, c } = selectedLayoutCell;
  const meta = getDeskMeta(cr, r, c);
  document.getElementById('cellEditTitle').textContent = `${r+1}行 ${c+1}列 の机設定`;
  document.getElementById('cellOrientSelect').value = meta.orient || 'front';
  document.getElementById('disableBtn').textContent = meta.disabled ? '有効化する' : 'この席を無効化';
}

function renderStudentList() {
  const cr = getClassroom();
  const el = document.getElementById('studentList');
  const countEl = document.getElementById('studentCount');
  if (!cr) { el.innerHTML = ''; return; }
  if (cr.students.length === 0) {
    el.innerHTML = '<div class="empty-state">生徒が登録されていません</div>';
    countEl.textContent = '';
    return;
  }
  const active = cr.students.filter(s => !s.inactive).length;
  countEl.textContent = `合計: ${cr.students.length}名 / 有効: ${active}名`;
  el.innerHTML = cr.students.map(s => {
    const group = getGroupForStudent(cr, s.id);
    const fixedKey = Object.entries(cr.deskMeta || {}).find(([k,m]) => m.fixedStudentId === s.id)?.[0];
    const fixedLabel = fixedKey ? (() => { const {r,c} = parseSeatKey(fixedKey); return `${r+1}行${c+1}列`; })() : '';
    return `<div class="student-item ${s.inactive?'':''}">
      <span class="student-name" style="${s.inactive?'opacity:0.4;text-decoration:line-through;':''}">${escHtml(s.name)}</span>
      ${group ? `<span class="student-badge" style="background:${group.color};color:#fff">${escHtml(group.name)}</span>` : '<span class="student-badge" style="background:#bbb;color:#fff">未所属</span>'}
      ${fixedLabel ? `<span class="student-badge badge-fixed">🔒${fixedLabel}</span>` : ''}
      <button class="btn-secondary btn-sm" onclick="editStudent('${s.id}')">${s.inactive?'有効':'編集'}</button>
      <button class="btn-secondary btn-sm" onclick="toggleStudentActive('${s.id}')">${s.inactive?'有効化':'除外'}</button>
      <button class="btn-danger btn-sm" onclick="deleteStudent('${s.id}')">✕</button>
    </div>`;
  }).join('');
}

function renderGroupList() {
  const cr = getClassroom();
  const el = document.getElementById('groupList');
  const ungrouped = document.getElementById('ungroupedStudents');
  if (!cr) { el.innerHTML = ''; ungrouped.innerHTML = ''; return; }

  el.innerHTML = cr.groups.map(g => {
    const members = (g.memberIds || []).map(sid => {
      const s = getStudentById(cr, sid);
      return s ? `<span class="member-chip" onclick="removeFromGroup('${sid}')" title="クリックでグループから外す" style="background:${g.color}33">${escHtml(s.name)} ✕</span>` : '';
    }).join('');
    return `<div class="group-card" style="background:${g.color}22; border-color:${g.color}">
      <div class="group-header">
        <span class="color-dot" style="background:${g.color}" onclick="changeGroupColor('${g.id}')"></span>
        <input class="group-name-input" value="${escHtml(g.name)}" onchange="renameGroup('${g.id}',this.value)" style="color:${darkenColor(g.color)}">
        <span class="text-muted text-sm">${(g.memberIds||[]).length}名</span>
        <button class="btn-danger btn-sm" onclick="deleteGroup('${g.id}')">✕</button>
      </div>
      <div class="group-members">${members || '<span class="text-muted text-sm">メンバーなし</span>'}</div>
    </div>`;
  }).join('') || '<div class="empty-state">グループがありません。追加してください。</div>';

  // Ungrouped
  const allGrouped = new Set(cr.groups.flatMap(g => g.memberIds || []));
  const ungs = cr.students.filter(s => !allGrouped.has(s.id) && !s.inactive);
  ungrouped.innerHTML = ungs.length === 0
    ? '<span class="text-muted">全員グループに所属しています</span>'
    : ungs.map(s => `<span class="member-chip" onclick="openAssignGroupModal('${s.id}')">${escHtml(s.name)} ＋</span>`).join('');
}

function renderNGPanel() {
  const cr = getClassroom();
  if (!cr) return;

  // Refresh student selects
  const opts = cr.students.filter(s => !s.inactive).map(s => `<option value="${s.id}">${escHtml(s.name)}</option>`).join('');
  ['ngPairA','ngPairB','ngSeatStudent'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.innerHTML = opts;
  });

  // NG pair list
  const pairEl = document.getElementById('ngPairList');
  pairEl.innerHTML = (cr.ngPairs || []).map(p => `
    <div class="ng-item">
      <span class="ng-text">🚫 ${escHtml(getStudentName(cr,p.a))} × ${escHtml(getStudentName(cr,p.b))}${p.reason?' — '+escHtml(p.reason):''}</span>
      <button class="btn-danger btn-sm" onclick="removeNGPair('${p.id}')">✕</button>
    </div>`).join('') || '<div class="text-muted">NGペアなし</div>';

  renderGrid('ngSeatGrid', cr, 'ng');
  updateNGSeatInfo();
}

function updateNGSeatMode() {
  renderGrid('ngSeatGrid', getClassroom(), 'ng');
  updateNGSeatInfo();
}

function updateNGSeatInfo() {
  const cr = getClassroom();
  const sid = document.getElementById('ngSeatStudent')?.value;
  if (!cr || !sid) return;
  const allNGKeys = Object.entries(cr.deskMeta || {})
    .filter(([k,m]) => m.ngStudentIds && m.ngStudentIds.includes(sid))
    .map(([k]) => { const {r,c} = parseSeatKey(k); return `${r+1}行${c+1}列`; });
  document.getElementById('ngSeatInfo').textContent = allNGKeys.length > 0
    ? `${getStudentName(cr,sid)} のNG席: ${allNGKeys.join(', ')}`
    : `NG席: なし（席をクリックしてNG設定）`;
}

function renderSeatingGrid() {
  const cr = getClassroom();
  renderGrid('seatingGrid', cr, 'seating');
  renderWarnings();
}

function renderWarnings() {
  const el = document.getElementById('seatingWarnings');
  if (!currentDraft || !currentDraft.warnings.length) { el.innerHTML = ''; return; }
  const errors = currentDraft.warnings.filter(w => w.severity === 'error');
  const warns = currentDraft.warnings.filter(w => w.severity === 'warn');
  const infos = currentDraft.warnings.filter(w => w.severity === 'info');
  const header = `<div class="flex gap-8 items-center mb-8">
    ${errors.length?`<span class="count-badge">❌ エラー ${errors.length}</span>`:''}
    ${warns.length?`<span style="background:var(--warn);color:#fff;" class="count-badge">⚠️ 警告 ${warns.length}</span>`:''}
    ${infos.length?`<span style="background:#3498db;color:#fff;" class="count-badge">ℹ️ 情報 ${infos.length}</span>`:''}
  </div>`;
  el.innerHTML = header + currentDraft.warnings.map(w => `
    <div class="warn-item ${w.severity}" onclick="highlightWarning(${JSON.stringify(w.seats||[])})">
      <span class="warn-icon">${w.severity==='error'?'❌':w.severity==='warn'?'⚠️':'ℹ️'}</span>
      <span>${escHtml(w.message)}</span>
    </div>`).join('');
}

function renderHistoryList() {
  const cr = getClassroom();
  const el = document.getElementById('historyList');
  if (!cr || !cr.history.length) {
    el.innerHTML = '<div class="empty-state">履歴がありません</div>';
    return;
  }
  el.innerHTML = [...cr.history].reverse().map(h => `
    <div class="history-item">
      <span class="history-label">${escHtml(h.label)}</span>
      <span class="history-date">${h.date}</span>
      <button class="btn-secondary btn-sm" onclick="previewHistory('${h.id}')">表示</button>
      <button class="btn-secondary btn-sm" onclick="restoreHistory('${h.id}')">この配置を使う</button>
      <button class="btn-danger btn-sm" onclick="deleteHistory('${h.id}')">✕</button>
    </div>`).join('');
}

function renderRoster() {
  const cr = getClassroom();
  const el = document.getElementById('rosterContent');
  if (!cr || !currentDraft) {
    el.innerHTML = '<div class="empty-state">席替えを実行してください</div>';
    renderGrid('rosterGrid', null, 'roster');
    return;
  }
  const rosterEl = document.createElement('div');
  rosterEl.className = 'roster-grid';
  for (const g of cr.groups) {
    const members = (g.memberIds || []).map(sid => {
      const seat = currentDraft.assignment[Object.keys(currentDraft.assignment).find(k => currentDraft.assignment[k] === sid) || ''] !== undefined
        ? (() => { const k = Object.entries(currentDraft.assignment).find(([,v])=>v===sid)?.[0]; return k ? (() => { const {r,c}=parseSeatKey(k); return `${r+1}行${c+1}列`; })() : ''; })()
        : '';
      return `<li>${escHtml(getStudentName(cr,sid))} <span class="text-muted text-sm">${seat}</span></li>`;
    }).join('');
    const card = document.createElement('div');
    card.className = 'roster-card';
    card.style.background = g.color + '22';
    card.style.border = `2px solid ${g.color}`;
    card.style.borderRadius = '8px';
    card.innerHTML = `<h3 style="color:${darkenColor(g.color)}">${escHtml(g.name)}</h3><ol>${members}</ol>`;
    rosterEl.appendChild(card);
  }
  el.innerHTML = '';
  el.appendChild(rosterEl);
  renderGrid('rosterGrid', cr, 'roster');
}

// ─────────────────────────────────────────────
function selectClassroom(id) {
  state.activeId = id;
  selectedLayoutCell = null;
  currentDraft = null;
  saveState();
  renderAll();
}

function applyLayout() {
  const cr = getClassroom();
  if (!cr) return;
  const rows = parseInt(document.getElementById('rowsInput').value) || 5;
  const cols = parseInt(document.getElementById('colsInput').value) || 6;
  cr.rows = Math.min(Math.max(rows,1),10);
  cr.cols = Math.min(Math.max(cols,1),12);
  saveState();
  renderAll();
}

function selectLayoutCell(r, c) {
  selectedLayoutCell = { r, c };
  const cr = getClassroom();
  document.getElementById('rowsInput').value = cr.rows;
  document.getElementById('colsInput').value = cr.cols;
  renderLayoutGrid();
}

function setCellOrient(val) {
  if (!selectedLayoutCell) return;
  const cr = getClassroom();
  const m = getDeskMeta(cr, selectedLayoutCell.r, selectedLayoutCell.c);
  m.orient = val;
  saveState();
  renderLayoutGrid();
  renderSeatingGrid();
}

function toggleCellDisabled() {
  if (!selectedLayoutCell) return;
  const cr = getClassroom();
  const m = getDeskMeta(cr, selectedLayoutCell.r, selectedLayoutCell.c);
  m.disabled = !m.disabled;
  saveState();
  renderLayoutGrid();
}

function addStudent() {
  const inp = document.getElementById('newStudentName');
  const name = inp.value.trim();
  if (!name) return;
  const cr = getClassroom();
  cr.students.push({ id: uid(), name, inactive: false });
  inp.value = '';
  saveState();
  renderStudentList();
  renderGroupList();
  renderNGPanel();
}

function deleteStudent(sid) {
  if (!confirm('この生徒を削除しますか？')) return;
  const cr = getClassroom();
  cr.students = cr.students.filter(s => s.id !== sid);
  cr.groups.forEach(g => { g.memberIds = (g.memberIds||[]).filter(x => x!==sid); });
  cr.ngPairs = (cr.ngPairs||[]).filter(p => p.a !== sid && p.b !== sid);
  for (const [k,m] of Object.entries(cr.deskMeta||{})) {
    if (m.fixedStudentId === sid) m.fixedStudentId = null;
    if (m.ngStudentIds) m.ngStudentIds = m.ngStudentIds.filter(x=>x!==sid);
  }
  saveState();
  renderAll();
}

function editStudent(sid) {
  const cr = getClassroom();
  const s = getStudentById(cr, sid);
  if (!s) return;
  const groups = cr.groups;
  const currentGroup = getGroupForStudent(cr, sid);
  const fixedKey = Object.entries(cr.deskMeta||{}).find(([k,m]) => m.fixedStudentId===sid)?.[0];
  openModal('editStudent', {
    title: '生徒の編集',
    content: `
      <div class="field mb-8"><label>名前</label><input id="editName" value="${escHtml(s.name)}"></div>
      <div class="field mb-8"><label>グループ</label>
        <select id="editGroup">
          <option value="">未所属</option>
          ${groups.map(g => `<option value="${g.id}" ${currentGroup?.id===g.id?'selected':''}>${escHtml(g.name)}</option>`).join('')}
        </select>
      </div>
      <div class="field mb-8"><label>固定席</label>
        <select id="editFixed">
          <option value="">固定なし</option>
          ${getEnabledSeats(cr).map(k => { const {r,c}=parseSeatKey(k); return `<option value="${k}" ${fixedKey===k?'selected':''}>${r+1}行${c+1}列</option>`; }).join('')}
        </select>
      </div>`,
    onOk: () => {
      s.name = document.getElementById('editName').value.trim() || s.name;
      // update group
      cr.groups.forEach(g => { g.memberIds = (g.memberIds||[]).filter(x=>x!==sid); });
      const gid = document.getElementById('editGroup').value;
      if (gid) { const g = cr.groups.find(g=>g.id===gid); if(g){ if(!g.memberIds) g.memberIds=[]; g.memberIds.push(sid); } }
      // update fixed seat
      for (const [k,m] of Object.entries(cr.deskMeta||{})) if(m.fixedStudentId===sid) m.fixedStudentId=null;
      const fk = document.getElementById('editFixed').value;
      if (fk) { const m = getDeskMeta(cr, ...fk.split('-').map(Number)); m.fixedStudentId = sid; }
      saveState();
      renderAll();
    }
  });
}

function toggleStudentActive(sid) {
  const cr = getClassroom();
  const s = getStudentById(cr, sid);
  if (s) { s.inactive = !s.inactive; saveState(); renderStudentList(); }
}

function addGroup() {
  const cr = getClassroom();
  const color = GROUP_COLORS[cr.groups.length % GROUP_COLORS.length];
  cr.groups.push({ id: uid(), name: `${cr.groups.length+1}班`, color, memberIds: [] });
  saveState();
  renderGroupList();
}

function deleteGroup(gid) {
  if (!confirm('このグループを削除しますか？（所属生徒は未所属になります）')) return;
  const cr = getClassroom();
  cr.groups = cr.groups.filter(g => g.id !== gid);
  saveState();
  renderGroupList();
}

function renameGroup(gid, name) {
  const cr = getClassroom();
  const g = getGroupById(cr, gid);
  if (g) { g.name = name; saveState(); }
}

function changeGroupColor(gid) {
  const cr = getClassroom();
  const g = getGroupById(cr, gid);
  if (!g) return;
  const idx = GROUP_COLORS.indexOf(g.color);
  g.color = GROUP_COLORS[(idx+1) % GROUP_COLORS.length];
  saveState();
  renderGroupList();
  renderSeatingGrid();
  renderRoster();
}

function removeFromGroup(sid) {
  const cr = getClassroom();
  cr.groups.forEach(g => { g.memberIds = (g.memberIds||[]).filter(x=>x!==sid); });
  saveState();
  renderGroupList();
}

function openAssignGroupModal(sid) {
  const cr = getClassroom();
  const s = getStudentById(cr, sid);
  openModal('generic', {
    title: `${s.name} のグループ設定`,
    content: `<select id="assignGroupSel">
      <option value="">未所属</option>
      ${cr.groups.map(g=>`<option value="${g.id}">${escHtml(g.name)}</option>`).join('')}
    </select>`,
    onOk: () => {
      cr.groups.forEach(g => { g.memberIds=(g.memberIds||[]).filter(x=>x!==sid); });
      const gid = document.getElementById('assignGroupSel').value;
      if (gid) { const g=cr.groups.find(g=>g.id===gid); if(g){if(!g.memberIds)g.memberIds=[];g.memberIds.push(sid);} }
      saveState();
      renderGroupList();
    }
  });
}

function autoDistributeGroups() {
  const cr = getClassroom();
  if (!cr.groups.length) { alert('グループを先に作成してください'); return; }
  const actives = cr.students.filter(s=>!s.inactive);
  cr.groups.forEach(g => g.memberIds = []);
  actives.forEach((s,i) => {
    const g = cr.groups[i % cr.groups.length];
    if (!g.memberIds) g.memberIds=[];
    g.memberIds.push(s.id);
  });
  saveState();
  renderGroupList();
}

function addNGPair() {
  const cr = getClassroom();
  const a = document.getElementById('ngPairA').value;
  const b = document.getElementById('ngPairB').value;
  if (!a || !b || a===b) { alert('異なる2人の生徒を選択してください'); return; }
  if ((cr.ngPairs||[]).some(p=>(p.a===a&&p.b===b)||(p.a===b&&p.b===a))) { alert('すでに登録されています'); return; }
  const reason = document.getElementById('ngPairReason').value.trim();
  if (!cr.ngPairs) cr.ngPairs = [];
  cr.ngPairs.push({ id:uid(), a, b, reason });
  document.getElementById('ngPairReason').value = '';
  saveState();
  renderNGPanel();
}

function removeNGPair(pid) {
  const cr = getClassroom();
  cr.ngPairs = (cr.ngPairs||[]).filter(p=>p.id!==pid);
  saveState();
  renderNGPanel();
}

function toggleNGSeat(r, c) {
  const cr = getClassroom();
  const sid = document.getElementById('ngSeatStudent')?.value;
  if (!sid) return;
  const m = getDeskMeta(cr, r, c);
  if (!m.ngStudentIds) m.ngStudentIds = [];
  if (m.ngStudentIds.includes(sid)) {
    m.ngStudentIds = m.ngStudentIds.filter(x=>x!==sid);
  } else {
    m.ngStudentIds.push(sid);
  }
  saveState();
  renderGrid('ngSeatGrid', cr, 'ng');
  updateNGSeatInfo();
}

function runSeating() {
  const cr = getClassroom();
  if (!cr) return;
  if (!cr.students.filter(s=>!s.inactive).length) { alert('生徒が登録されていません'); return; }
  const result = runSeatingAlgorithm(cr);
  if (result.message && !result.assignment) { alert(result.message); return; }
  currentDraft = { assignment: result.assignment, warnings: result.warnings };
  document.getElementById('saveHistoryBtn').disabled = false;
  renderSeatingGrid();
  renderRoster();
}

function saveCurrentAsHistory() {
  if (!currentDraft) return;
  const cr = getClassroom();
  const label = prompt('この席替えのラベルを入力してください', `${new Date().toLocaleDateString('ja-JP')} 第${(cr.history.length+1)}回`);
  if (label === null) return;
  // Build group snapshot
  const groupSnapshot = {};
  for (const g of cr.groups) for (const sid of (g.memberIds||[])) groupSnapshot[sid] = g.id;
  cr.history.push({
    id: uid(),
    label: label || `第${cr.history.length+1}回`,
    date: new Date().toLocaleDateString('ja-JP'),
    seats: { ...currentDraft.assignment },
    groupSnapshot
  });
  saveState();
  renderHistoryList();
  alert('履歴に保存しました');
}

function previewHistory(hid) {
  const cr = getClassroom();
  const h = cr.history.find(x=>x.id===hid);
  if (!h) return;
  document.getElementById('historyPreviewCard').style.display = 'block';
  document.getElementById('historyPreviewTitle').textContent = `履歴: ${h.label}`;
  renderGrid('historyPreviewGrid', cr, 'history', h.seats);
  document.getElementById('historyPreviewCard').scrollIntoView({ behavior:'smooth' });
}

function restoreHistory(hid) {
  const cr = getClassroom();
  const h = cr.history.find(x=>x.id===hid);
  if (!h) return;
  if (!confirm(`「${h.label}」の配置を席替え画面に読み込みますか？`)) return;
  currentDraft = { assignment: { ...h.seats }, warnings: checkSoftConstraints(cr, h.seats) };
  document.getElementById('saveHistoryBtn').disabled = false;
  switchTab('seating');
  renderSeatingGrid();
  renderRoster();
}

function deleteHistory(hid) {
  if (!confirm('この履歴を削除しますか？')) return;
  const cr = getClassroom();
  cr.history = cr.history.filter(h=>h.id!==hid);
  saveState();
  renderHistoryList();
}

function highlightWarning(seats) {
  if (!seats) return;
  document.querySelectorAll('.seat-cell').forEach(el => el.style.outline = '');
  for (const key of seats) {
    document.querySelector(`.seat-cell[data-key="${key}"]`)?.scrollIntoView({ behavior:'smooth', block:'nearest' });
    document.querySelectorAll(`.seat-cell[data-key="${key}"]`).forEach(el => {
      el.style.outline = '3px solid purple';
      setTimeout(() => { el.style.outline = ''; }, 2000);
    });
  }
}

// ─────────────────────────────────────────────
// MODAL
// ─────────────────────────────────────────────
let modalOkCb = null;

function openModal(type, opts) {
  const overlay = document.getElementById('modal');
  const title = document.getElementById('modalTitle');
  const body = document.getElementById('modalBody');
  const actions = document.getElementById('modalActions');
  actions.innerHTML = `<button class="btn-secondary" onclick="closeModal()">キャンセル</button><button class="btn-primary" id="modalOkBtn">OK</button>`;
  modalOkCb = null;

  if (type === 'addClassroom') {
    title.textContent = '教室を追加';
    body.innerHTML = '<div class="field"><label>教室名</label><input id="newClassName" placeholder="例: 3年2組"></div>';
    modalOkCb = () => {
      const name = document.getElementById('newClassName').value.trim();
      if (!name) return;
      createClassroom(name, parseInt(document.getElementById('rowsInput').value)||5, parseInt(document.getElementById('colsInput').value)||6);
      renderAll();
      closeModal();
    };
  } else if (type === 'renameClassroom') {
    const cr = getClassroom();
    if (!cr) return;
    title.textContent = '教室名を変更';
    body.innerHTML = `<div class="field"><label>教室名</label><input id="renameInput" value="${escHtml(cr.name)}"></div>`;
    modalOkCb = () => {
      const name = document.getElementById('renameInput').value.trim();
      if (name) { cr.name = name; saveState(); renderHeader(); }
      closeModal();
    };
  } else if (type === 'csvImport') {
    title.textContent = 'CSVインポート';
    body.innerHTML = `<p class="text-muted mb-8">1行1名の形式で貼り付けてください。<br>書式: 名前（1列目のみ使用）</p><textarea id="csvText" rows="10" placeholder="田中太郎\n佐藤花子\n鈴木一郎"></textarea>`;
    modalOkCb = () => {
      importStudentCSV(document.getElementById('csvText').value);
      closeModal();
    };
  } else if (type === 'editStudent' && opts) {
    title.textContent = opts.title || '編集';
    body.innerHTML = opts.content || '';
    modalOkCb = () => { opts.onOk?.(); closeModal(); };
  } else if (type === 'generic' && opts) {
    title.textContent = opts.title || '';
    body.innerHTML = opts.content || '';
    modalOkCb = () => { opts.onOk?.(); closeModal(); };
  }

  document.getElementById('modalOkBtn').onclick = () => modalOkCb?.();
  overlay.classList.add('open');
  setTimeout(() => overlay.querySelector('input, select, textarea')?.focus(), 100);
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ─────────────────────────────────────────────
// CSV
// ─────────────────────────────────────────────
function importStudentCSV(text) {
  const cr = getClassroom();
  const lines = text.split('\n').map(l=>l.trim()).filter(Boolean);
  let added = 0;
  for (const line of lines) {
    const name = line.split(',')[0].trim();
    if (!name) continue;
    if (cr.students.find(s=>s.name===name)) continue;
    cr.students.push({ id:uid(), name, inactive:false });
    added++;
  }
  saveState();
  renderStudentList();
  renderGroupList();
  renderNGPanel();
  alert(`${added}名追加しました`);
}

function exportStudentCSV() {
  const cr = getClassroom();
  const lines = cr.students.map(s => s.name);
  const blob = new Blob([lines.join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `生徒名簿_${cr.name}.csv`;
  a.click();
}

function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `席替えデータ_${new Date().toLocaleDateString('ja-JP').replace(/\//g,'-')}.json`;
  a.click();
}

function triggerImport() { document.getElementById('importFile').click(); }

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.classrooms) {
        if (!confirm('現在のデータを上書きします。よろしいですか？')) return;
        state = data;
        saveState();
        renderAll();
        alert('読み込みました');
      } else { alert('形式が正しくありません'); }
    } catch { alert('ファイルの読み込みに失敗しました'); }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ─────────────────────────────────────────────
// TAB SWITCHING
// ─────────────────────────────────────────────
function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
  document.getElementById(`tab-${name}`)?.classList.add('active');
  document.getElementById(`tab-btn-${name}`)?.classList.add('active');
  // Sync layout inputs
  const cr = getClassroom();
  if (cr && name === 'layout') {
    document.getElementById('rowsInput').value = cr.rows;
    document.getElementById('colsInput').value = cr.cols;
  }
  if (name === 'ng') renderNGPanel();
  if (name === 'roster') renderRoster();
}

// ─────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────
function escHtml(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function darkenColor(hex) {
  // Returns a darkened version for text
  try {
    let r = parseInt(hex.slice(1,3),16);
    let g = parseInt(hex.slice(3,5),16);
    let b = parseInt(hex.slice(5,7),16);
    r = Math.max(0,r-60); g = Math.max(0,g-60); b = Math.max(0,b-60);
    return `rgb(${r},${g},${b})`;
  } catch { return '#333'; }
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
loadState();
renderAll();

// Sync layout inputs on load
const _cr = getClassroom();
if (_cr) {
  document.getElementById('rowsInput').value = _cr.rows;
  document.getElementById('colsInput').value = _cr.cols;
}
