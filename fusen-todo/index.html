<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ToDo丸</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🦉 ToDo丸(とどまる)</h1>
    <button id="add-btn" title="タスクを追加">＋</button>
  </header>

  <main>
    <nav id="toolbar">
      <div id="tabs">
        <button class="tab active" data-tab="active">📋 やること</button>
        <button class="tab" data-tab="done">✅ 完了</button>
        <button class="tab" data-tab="saved">💾 保存</button>
      </div>
      <select id="sort-select" title="並び替え">
        <option value="deadline">締め切り順</option>
        <option value="created">登録順</option>
        <option value="priority">優先度順</option>
      </select>
    </nav>

    <div id="form-card">
      <label>タスク名 *
        <input type="text" id="f-title" placeholder="例: レポート提出" />
      </label>
      <label>カテゴリ
        <select id="f-category"></select>
      </label>
      <div id="new-cat-row" hidden>
        <input type="text" id="nc-name" placeholder="新しいカテゴリ名" />
        <input type="color" id="nc-color" value="#ffd9b8" title="付箋の色" />
        <button type="button" class="primary" id="nc-add">追加</button>
      </div>
      <label>期限
        <input type="date" id="f-deadline" />
      </label>
      <label>繰り返し
        <select id="f-repeat">
          <option value="none">なし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
        </select>
      </label>
      <label>優先度
        <select id="f-priority">
          <option value="high">🔴 高</option>
          <option value="mid" selected>🟡 中</option>
          <option value="low">🔵 低</option>
        </select>
      </label>
      <label>提出先
        <input type="text" id="f-target" placeholder="例: 山田先生 / 経理部" />
      </label>
      <label>紐付けURL
        <input type="url" id="f-url" placeholder="https://..." />
      </label>
      <label>メモ
        <textarea id="f-memo" rows="3" placeholder="補足や持ち物など(タスクをクリックすると見られます)"></textarea>
      </label>

      <div class="notify-row">
        <label><input type="checkbox" id="f-notify" /> 通知する</label>
      </div>

      <div id="notify-options">
        <label>通知時間
          <div class="time-row">
            <input type="date" id="f-notify-date" />
            <input type="number" id="f-notify-hour" min="0" max="23" value="8" />
            <span>時</span>
            <input type="number" id="f-notify-min" min="0" max="59" value="0" />
            <span>分</span>
          </div>
        </label>
        <div class="notify-row">
          <label><input type="radio" name="f-sound" value="sound" /> 🔔 音あり</label>
          <label><input type="radio" name="f-sound" value="silent" checked /> 🔕 音なし(表示のみ)</label>
        </div>
      </div>

      <div class="form-actions">
        <button class="ghost" id="f-cancel">キャンセル</button>
        <button class="primary" id="f-save">登録</button>
      </div>
    </div>

    <div id="list"></div>
    <div id="empty" hidden>タスクはありません。「＋」から追加してください。</div>
  </main>

  <footer id="settings-bar">
    <label><input type="checkbox" id="autostart" /> 🚀 PC起動時に自動で起動する</label>
  </footer>

  <div id="modal-overlay" hidden>
    <div class="modal-box">
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-message" id="modal-message"></div>
      <div class="modal-fields" id="modal-fields"></div>
      <div class="modal-actions" id="modal-actions"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
