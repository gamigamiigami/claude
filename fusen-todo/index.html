<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ToDo丸</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🦉 ToDo丸(とどまる)</h1>
    <button id="add-btn" title="タスクを追加">＋</button>
  </header>

  <main>
    <div id="form-card">
      <label>タスク名 *
        <input type="text" id="f-title" placeholder="例: レポート提出" />
      </label>
      <label>カテゴリ
        <select id="f-category"></select>
      </label>
      <div id="new-cat-row" hidden>
        <input type="text" id="nc-name" placeholder="新しいカテゴリ名" />
        <input type="color" id="nc-color" value="#ffd9b8" title="付箋の色" />
        <button type="button" class="primary" id="nc-add">追加</button>
      </div>
      <label>期限
        <input type="date" id="f-deadline" />
      </label>
      <label>繰り返し
        <select id="f-repeat">
          <option value="none">なし</option>
          <option value="daily">毎日</option>
          <option value="weekly">毎週</option>
          <option value="monthly">毎月</option>
        </select>
      </label>
      <label>提出先
        <input type="text" id="f-target" placeholder="例: 山田先生 / 経理部" />
      </label>
      <label>紐付けURL
        <input type="url" id="f-url" placeholder="https://..." />
      </label>
      <label>メモ
        <textarea id="f-memo" rows="3" placeholder="補足や持ち物など(タスクをクリックすると見られます)"></textarea>
      </label>

      <div class="notify-row">
        <label><input type="checkbox" id="f-notify" /> 通知する</label>
      </div>

      <div id="notify-options">
        <label>通知時間
          <input type="datetime-local" id="f-notify-at" />
        </label>
        <div class="notify-row">
          <label><input type="radio" name="f-sound" value="sound" checked /> 🔔 音あり</label>
          <label><input type="radio" name="f-sound" value="silent" /> 🔕 音なし(表示のみ)</label>
        </div>
      </div>

      <div class="form-actions">
        <button class="ghost" id="f-cancel">キャンセル</button>
        <button class="primary" id="f-save">登録</button>
      </div>
    </div>

    <div id="list"></div>
    <div id="empty" hidden>タスクはありません。「＋」から追加してください。</div>
  </main>

  <footer id="settings-bar">
    <label><input type="checkbox" id="autostart" /> 🚀 PC起動時に自動で起動する</label>
  </footer>

  <script src="renderer.js"></script>
</body>
</html>
