<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>リマインド</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", sans-serif;
      background: #fff7c0;
      color: #4a4220;
      border: 2px solid #e0a800;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px 14px;
      gap: 6px;
      overflow: hidden;
      -webkit-app-region: drag; /* つかんで移動できる */
    }
    .head {
      font-size: 12px;
      color: #a07800;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .title {
      font-size: 17px;
      font-weight: 700;
      word-break: break-all;
      flex: 1;
    }
    .meta { font-size: 12px; color: #7a6e3a; }
    .actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      -webkit-app-region: no-drag;
    }
    button {
      padding: 6px 14px;
      border-radius: 3px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #c9b850;
      background: #fff;
      color: #4a4220;
      font-family: inherit;
    }
    button.done {
      background: #5d8a4a;
      border-color: #5d8a4a;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="head">⏰ リマインド</div>
  <div class="title" id="r-title"></div>
  <div class="meta" id="r-meta"></div>
  <div class="actions">
    <button id="r-snooze">あとで (10分)</button>
    <button id="r-close">閉じる</button>
    <button class="done" id="r-done">✓ 完了にする</button>
  </div>

  <script>
    const task = JSON.parse(new URLSearchParams(location.search).get('task'));

    document.getElementById('r-title').textContent = task.title;
    const meta = [];
    if (task.deadline) {
      const d = new Date(task.deadline);
      meta.push(`📅 期限: ${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`);
    }
    if (task.target) meta.push(`📮 提出先: ${task.target}`);
    document.getElementById('r-meta').textContent = meta.join('　');

    document.getElementById('r-done').addEventListener('click', () =>
      window.api.reminderAction(task.id, 'done'));
    document.getElementById('r-snooze').addEventListener('click', () =>
      window.api.reminderAction(task.id, 'snooze'));
    document.getElementById('r-close').addEventListener('click', () =>
      window.api.reminderAction(task.id, 'close'));

    // 音あり通知: 音声ファイル不要のチャイム(ピンポン)を鳴らす
    if (task.sound) {
      const ctx = new AudioContext();
      const ping = (freq, when) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(0.3, when + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.7);
        osc.connect(gain).connect(ctx.destination);
        osc.start(when);
        osc.stop(when + 0.8);
      };
      ping(880, ctx.currentTime);
      ping(660, ctx.currentTime + 0.35);
    }
  </script>
</body>
</html>
